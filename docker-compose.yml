version: '3.8'

services:
  zoo-mysql:
    image: mysql:8.0
    container_name: zoo-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zoo_fantastico}
      MYSQL_USER: ${MYSQL_USER:-zoo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zoo_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zoo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoo-app
    restart: on-failure
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: zoo-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-zoo_fantastico}
      DB_USER: ${MYSQL_USER:-zoo_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-zoo_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-true}
    depends_on:
      zoo-mysql:
        condition: service_healthy
    networks:
      - zoo-network

volumes:
  mysql_data:

networks:
  zoo-network:
    driver: bridge

