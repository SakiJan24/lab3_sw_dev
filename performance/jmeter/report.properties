# Propiedades del dashboard HTML para las corridas de zoo-creatures.jmx.
# Uso: jmeter -n -t zoo-creatures.jmx ... -q report.properties -l results/res_N.jtl -e -o results/report_N
#  o para regenerar: jmeter -g results/res_N.jtl -q report.properties -o results/report_N
# No modifica bin/reportgenerator.properties de la instalación de JMeter.

# Granularidad de los gráficos "over time" en ms (1000 = 1 s; es el mínimo permitido).
# Las corridas duran 3-14 s, con el valor por defecto (60000 = 1 min) todo cae en un solo punto.
jmeter.reportgenerator.overall_granularity=1000

# Solo las peticiones de la carga; excluye la petición del setUp (crear zona).
jmeter.reportgenerator.sample_filter=^POST /api/creatures$
